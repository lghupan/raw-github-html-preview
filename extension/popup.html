<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Raw GitHub HTML Preview</title>
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">RAW GITHUB</p>
      <h1>HTML Preview</h1>
      <p id="status" role="status">Checking this tab...</p>
      <p id="file" hidden></p>
      <button id="toggle" type="button" disabled>View source</button>
      <p class="note">Standalone HTML only. Embedded scripts run in isolation. External assets are blocked.</p>
    </main>
  </body>
</html>
